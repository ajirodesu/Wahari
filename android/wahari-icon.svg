<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="W agent icon, angular style">
  <title>W Agent — AjiroDesu</title>
  <rect width="1024" height="1024" rx="140" fill="#0A0A0C"/>

  <!-- angular W built from four slanted bars -->
  <g fill="#F2F2F2">
    <polygon points="150,260 272,260 452,760 330,760"/>
    <polygon points="330,760 450,760 572,420 452,420"/>
    <polygon points="452,420 572,420 694,760 574,760"/>
    <polygon points="574,760 694,760 874,260 754,260"/>
  </g>

  <!-- hard diagonal cut through the mark -->
  <line x1="110" y1="600" x2="914" y2="500" stroke="#0A0A0C" stroke-width="16"/>

  <!-- single accent: the peak cap -->
  <polygon points="452,420 572,420 560,470 464,470" fill="#FF5A1F"/>
</svg>
